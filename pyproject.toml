[project]
name = "tealeaf"
version = "0.1.0"
description = "Evaluate and probe local LLMs: traditional benchmarks plus belief, conversation and weirdness probes, with a live web dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
opik = ["opik>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
tealeaf = "tealeaf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tealeaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
