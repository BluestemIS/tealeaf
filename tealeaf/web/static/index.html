<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tealeaf</title>
<link rel="icon" type="image/svg+xml" href="/tealeaf.svg">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel-2: #f0eee9; --border: #e2dfd8; --text: #1d1c1a; --muted: #6f6b63;
  --accent: #4b5bd6; --pass: #2f8a4f; --fail: #c4423a; --error: #9b3fb5; --observed: #1f7f99; --running: #c88a12;
  --skipped: #9a958c; --bubble-user: #eef0fc; --bubble-ai: #ffffff; --bubble-inter: #fdf3e2; --bubble-sys: #f0eee9;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --panel: #1d1c1a; --panel-2: #26251f; --border: #34322c; --text: #ecebe6; --muted: #9a958c;
    --accent: #8b97f0; --pass: #5cc07f; --fail: #ef6b62; --error: #c27ae0; --observed: #4fb6d1; --running: #e8b04a;
    --skipped: #6f6b63; --bubble-user: #252a4a; --bubble-ai: #1d1c1a; --bubble-inter: #3a301c; --bubble-sys: #26251f;
  }
}
* { box-sizing: border-box; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.active { background: var(--panel-2); color: var(--text); font-weight: 600; }
.live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--skipped); }
.dot.on { background: var(--pass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pass) 25%, transparent); }
main { padding: 16px 18px; max-width: 1500px; margin: 0 auto; }
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.runlist { max-height: calc(100vh - 90px); overflow: auto; position: sticky; top: 64px; }
.runitem { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.runitem:hover { background: var(--panel-2); }
.runitem.sel { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
.runitem .m { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 12px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; border: 1px solid currentColor; line-height: 16px; white-space: nowrap; }
.st-pass { color: var(--pass); } .st-fail { color: var(--fail); } .st-error { color: var(--error); } .st-observed { color: var(--observed); }
.st-running, .st-cancelling { color: var(--running); } .st-pending, .st-skipped, .st-interrupted, .st-cancelled { color: var(--skipped); } .st-finished { color: var(--pass); } .st-queued { color: var(--accent); }
tr.dim td { opacity: .5; }
.flag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); margin: 1px 2px 1px 0; font-family: var(--mono); }
.flag.case { color: var(--text); }
.progress { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; background: var(--accent); transition: width .3s; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.stat { padding: 12px; } .stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; } .stat .k { color: var(--muted); font-size: 12px; }
.runhead { padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.runhead h2 { margin: 0 0 2px; font-size: 18px; }
.btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.danger { color: var(--fail); }
.btn:disabled { opacity: .5; cursor: default; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
tr.suite-row td { background: var(--panel-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.bar { width: 70px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.bar > div { height: 100%; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
.interest { font-family: var(--mono); font-size: 12px; color: var(--running); font-weight: 600; }
.suitebars { padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 24px; }
.suitebar { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; }
.suitebar .track { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.suitebar .track div { height: 100%; background: var(--accent); }
.nowrunning { padding: 12px 16px; border-left: 3px solid var(--running); }
.nowrunning pre { white-space: pre-wrap; margin: 6px 0 0; font: 13px/1.45 var(--mono); max-height: 160px; overflow: auto; color: var(--muted); }
/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 100vw); background: var(--bg); z-index: 11; overflow: auto; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.15); }
.drawer .top { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; z-index: 2; }
.drawer .body { padding: 14px 16px; display: grid; gap: 12px; }
.section { padding: 12px 14px; } .section h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; }
.kv .k { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.kv .v { font-family: var(--mono); font-size: 12px; word-break: break-word; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 99px; cursor: pointer; font-size: 12px; }
.tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); word-break: break-word; }
.msg .txt { white-space: pre-wrap; }
.msg .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; }
.msg.user { align-self: flex-end; background: var(--bubble-user); }
.msg.inter { align-self: flex-end; background: var(--bubble-inter); }
.msg.assistant { align-self: flex-start; background: var(--bubble-ai); }
.msg.system { align-self: center; background: var(--bubble-sys); font-size: 12px; color: var(--muted); max-width: 100%; }
.msg.judge { align-self: stretch; max-width: 100%; background: var(--panel-2); font: 12px/1.4 var(--mono); }
.msg.injected { border-style: dashed; border-color: var(--fail); }
.msg.streaming { border-color: var(--running); }
/* token confidence: the less likely a token was, the warmer its background */
.tok { border-radius: 2px; }
.tok.lp0 { background: color-mix(in srgb, var(--fail) 55%, transparent); }
.tok.lp1 { background: color-mix(in srgb, var(--fail) 30%, transparent); }
.tok.lp2 { background: color-mix(in srgb, var(--running) 30%, transparent); }
.tok.lp3 { background: color-mix(in srgb, var(--running) 12%, transparent); }
.lplegend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.lplegend .tok { padding: 0 4px; color: var(--text); }
details.reason { margin: 4px 0 6px; font-size: 12px; color: var(--muted); } details.reason summary { cursor: pointer; }
details.reason div { white-space: pre-wrap; max-height: 300px; overflow: auto; padding: 6px; background: var(--panel-2); border-radius: 6px; margin-top: 4px; }
blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--running); color: var(--muted); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.form { padding: 16px; display: grid; gap: 14px; max-width: 900px; }
.form label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.form input[type=text], .form input[type=number], .form select, .form textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; font: inherit; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
.suitepick { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.suitepick label { display: flex; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; cursor: pointer; margin: 0; }
.suitepick label small { display: block; color: var(--muted); }
.pad { padding: 12px 16px; }
.delta-pos { color: var(--pass); } .delta-neg { color: var(--fail); }
</style>
</head>
<body>
<header>
  <h1><img src="/tealeaf.svg" alt="" width="24" height="24">Tealeaf</h1>
  <nav id="nav">
    <button data-view="runs">Runs</button>
    <button data-view="highlights">Highlights</button>
    <button data-view="beliefs">Beliefs</button>
    <button data-view="compare">Compare</button>
    <button data-view="stability">Stability</button>
    <button data-view="models">Models</button>
    <button data-view="new">New run</button>
  </nav>
  <div class="live"><span class="dot" id="livedot"></span><span id="livetxt">connecting</span></div>
</header>
<main id="main"></main>
<div id="drawer"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Target API key typed into the UI: kept for this tab only (sessionStorage), sent as a header / in the run request.
const keyStore = { get() { try { return sessionStorage.getItem("tealeaf.apiKey") || ""; } catch { return ""; } },
  set(v) { try { v ? sessionStorage.setItem("tealeaf.apiKey", v) : sessionStorage.removeItem("tealeaf.apiKey"); } catch {} } };
const keyHeaders = () => S.apiKey ? {"X-Api-Key": S.apiKey} : {};
// x-tealeaf marks requests as coming from this page (the server refuses state changes without it).
const api = async (p, opt = {}) => { const r = await fetch(p, {...opt, headers: {...(opt.headers || {}), "X-Tealeaf": "1"}}); if (!r.ok) throw new Error((await r.text()) || r.status); return r.json(); };
const fmtTime = (t) => t ? new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
const dur = (a, b) => { if (!a) return ""; const s = Math.round((b || Date.now()/1000) - a); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s/60)}m ${s%60}s` : `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`; };
const chip = (st) => `<span class="chip st-${esc(st)}">${esc(st)}</span>`;
const scoreColor = (s) => s >= .8 ? "var(--pass)" : s >= .5 ? "var(--running)" : "var(--fail)";
const scoreBar = (s) => s == null ? `<span class="sub">–</span>` : `<span class="bar"><div style="width:${s*100}%;background:${scoreColor(s)}"></div></span><span class="num">${s.toFixed(2)}</span>`;
const flagsHtml = (flags) => (flags || []).map(f => `<span class="flag ${f.source === "case" ? "case" : ""}" title="${esc(f.note || f.source)}">${esc(f.name)}</span>`).join("");
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const S = { modelSel: new Set(), models: null, endpoint: null, cfg: null, view: "runs", runs: [], runId: null, run: null, results: [], suites: null, drawer: null, partial: {}, cmp: {a: "", b: ""}, stab: null, apiKey: keyStore.get(), lpView: false };
const saved = (() => { try { return JSON.parse(localStorage.getItem("tealeaf") || "{}"); } catch { return {}; } })();
const save = () => { try { localStorage.setItem("tealeaf", JSON.stringify({view: S.view, runId: S.runId})); } catch {} };

function setView(v) { S.view = v; save(); document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v)); render(); }
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => setView(b.dataset.view));

async function loadRuns() { S.runs = await api("/api/runs"); }
async function loadRun(id) {
  if (!id) { S.run = null; S.results = []; return; }
  const d = await api(`/api/runs/${id}`); S.run = d.run; S.results = d.results;
}

async function render() {
  const m = $("#main");
  if (S.view === "runs") return renderRuns(m);
  if (S.view === "highlights") return renderHighlights(m);
  if (S.view === "beliefs") return renderBeliefs(m);
  if (S.view === "compare") return renderCompare(m);
  if (S.view === "stability") return renderStability(m);
  if (S.view === "models") return renderModels(m);
  if (S.view === "new") return renderNew(m);
}

// ------------------------------------------------------------------ runs view
function runListHtml() {
  if (!S.runs.length) return `<div class="empty">No runs yet.<br><br><button class="btn primary" onclick="setView('new')">Start a run</button></div>`;
  return S.runs.map(r => {
    const pct = r.total_cases ? (r.done_cases / r.total_cases * 100) : 0;
    const avg = r.summary?.avg_score;
    return `<div class="runitem ${r.id === S.runId ? "sel" : ""}" onclick="selectRun('${esc(r.id)}')">
      <div style="display:flex;justify-content:space-between;gap:8px"><div class="m">${esc(r.target_model || "?")}</div>${chip(r.status)}</div>
      <div class="sub">${esc(r.label || r.id)} · ${fmtTime(r.started_at)}</div>
      <div class="sub">${r.done_cases}/${r.total_cases} cases${avg != null ? ` · avg ${avg.toFixed(2)}` : ""}</div>
      ${["running","cancelling","queued"].includes(r.status) ? `<div class="progress"><div style="width:${pct}%"></div></div>` : ""}
    </div>`;
  }).join("");
}

async function selectRun(id) { S.runId = id; save(); await loadRun(id); render(); }

function renderRuns(m) {
  m.innerHTML = `<div class="layout"><div class="card runlist" id="runlist">${runListHtml()}</div><div id="rundetail"></div></div>`;
  renderRunDetail();
}

function renderRunDetail() {
  const el = $("#rundetail"); if (!el) return;
  const r = S.run;
  if (!r) { el.innerHTML = `<div class="card empty">Select a run on the left.</div>`; return; }
  const s = r.summary || {};
  const counts = {}; S.results.forEach(x => counts[x.status] = (counts[x.status] || 0) + 1);
  const scored = S.results.filter(x => x.score != null);
  const avg = scored.length ? scored.reduce((a, x) => a + x.score, 0) / scored.length : null;
  const interesting = S.results.filter(x => x.interest >= 7).length;
  const active = ["running", "cancelling", "queued"].includes(r.status);
  const running = S.results.find(x => x.status === "running");
  const p = running && S.partial[`${r.id}|${running.case_id}`];

  // suite bars
  const suites = {};
  S.results.forEach(x => { (suites[x.suite] ||= {kind: x.kind, sc: [], n: 0, done: 0}); suites[x.suite].n++; if (!["pending","running"].includes(x.status)) suites[x.suite].done++; if (x.score != null) suites[x.suite].sc.push(x.score); });

  let rows = "", cur = null;
  for (const x of S.results) {
    if (x.suite !== cur) { cur = x.suite; rows += `<tr class="suite-row"><td colspan="6">${esc(cur)} <span style="font-weight:400;text-transform:none">· ${esc(x.kind)}</span></td></tr>`; }
    rows += `<tr class="click" onclick="openCase('${esc(r.id)}','${esc(x.case_id)}')">
      <td>${chip(x.status)}</td>
      <td><div>${esc(x.title)}</div><div class="sub">${esc(x.case_id)}${x.judge?.summary ? " · " + esc(x.judge.summary.slice(0, 140)) : ""}${x.error ? ` · <span class="st-error">${esc(x.error.slice(0,120))}</span>` : ""}</div></td>
      <td style="white-space:nowrap">${scoreBar(x.score)}</td>
      <td>${x.interest != null ? `<span class="interest">✦ ${x.interest.toFixed(0)}</span>` : ""}</td>
      <td>${flagsHtml((x.flags || []).slice(0, 5))}</td>
      <td class="num sub">${x.started_at ? dur(x.started_at, x.finished_at) : ""}</td></tr>`;
  }

  el.innerHTML = `
    <div class="card runhead">
      <div style="flex:1;min-width:240px">
        <h2>${esc(r.target_model)}</h2>
        <div class="sub">${esc(r.label || "")} ${r.label ? "·" : ""} run <span class="num">${esc(r.id)}</span> · ${esc(r.target_url)}</div>
        ${r.config?.group ? `<div class="sub">repeat ${r.config.group.index}/${r.config.group.of} · <a href="#" onclick="openStability('${esc(r.config.group.id)}');return false">stability across the group</a></div>` : ""}
        ${r.config?.run?.system_prompt ? `<details class="reason" style="margin-top:4px"><summary class="sub">run system prompt (${r.config.run.system_prompt.length} chars)</summary><div>${esc(r.config.run.system_prompt)}</div></details>` : ""}
        ${r.config?.model_prompt ? `<div class="sub"><a href="#" onclick="showPrompt(null, null, S.run.config.model_prompt);return false">model prompt at run start</a>${r.config.model_prompt.available ? (r.config.model_prompt.system ? " · has a built-in system prompt" : "") : " · not exposed by this server"}</div>` : ""}
        <div class="sub">judge: ${r.judge_is_target ? "self (target judges itself)" : esc(r.judge_model)} · started ${fmtTime(r.started_at)} · ${dur(r.started_at, r.finished_at)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">${chip(r.status)}
        ${!active && !r.config?.reannotated_from && (counts.skipped || counts.pending) ? `<button class="btn primary" onclick="resumeRun('${esc(r.id)}', false)" title="Run the ${(counts.skipped || 0) + (counts.pending || 0)} unfinished cases in this run, with its original settings">Resume</button>` : ""}
        ${!active && !r.config?.reannotated_from && counts.error ? `<button class="btn" onclick="resumeRun('${esc(r.id)}', true)" title="Rerun unfinished and errored cases">Rerun ${counts.error} error${counts.error === 1 ? "" : "s"}</button>` : ""}
        ${active ? `<button class="btn danger" onclick="cancelRun('${esc(r.id)}')">Cancel</button>` : `<button class="btn" onclick="deleteRun('${esc(r.id)}')">Delete</button>`}</div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="v">${avg != null ? avg.toFixed(2) : "–"}</div><div class="k">avg score (scored cases)</div></div>
      <div class="card stat"><div class="v"><span class="st-pass">${counts.pass || 0}</span> / <span class="st-fail">${counts.fail || 0}</span></div><div class="k">pass / fail</div></div>
      <div class="card stat"><div class="v st-observed">${counts.observed || 0}</div><div class="k">observed (unscored probes)</div></div>
      <div class="card stat"><div class="v interest">${interesting}</div><div class="k">interest ≥ 7</div></div>
      <div class="card stat"><div class="v">${s.tokens_per_sec ?? "–"}</div><div class="k">decode tok/s</div></div>
      ${s.calibration ? `<div class="card stat" title="From token probabilities on ${s.calibration.n} multiple-choice answers. Calibration error: average gap between confidence and accuracy (0 is perfect). Brier score ${s.calibration.brier}."><div class="v">${s.calibration.ece.toFixed(2)}</div><div class="k">calibration error · ${(s.calibration.mean_confidence * 100).toFixed(0)}% confident, ${(s.calibration.accuracy * 100).toFixed(0)}% right</div></div>` : ""}
      <div class="card stat"><div class="v">${r.done_cases}/${r.total_cases}</div><div class="k">cases done${counts.error ? ` · <span class="st-error">${counts.error} errors</span>` : ""}</div></div>
    </div>
    ${running ? `<div class="card nowrunning" style="margin-bottom:12px;cursor:pointer" onclick="openCase('${esc(r.id)}','${esc(running.case_id)}')">
      <div><span class="chip st-running">running</span> <b>${esc(running.title)}</b> <span class="sub">${esc(running.case_id)}</span></div>
      <pre id="nowtext">${esc(p ? (p.content || (p.reasoning ? "(thinking) " + p.reasoning : "")).slice(-1200) : "waiting for tokens…")}</pre></div>` : ""}
    <div class="card" style="margin-bottom:12px"><div class="suitebars">
      ${Object.entries(suites).map(([k, v]) => { const a = v.sc.length ? v.sc.reduce((p, c) => p + c, 0) / v.sc.length : null;

function msgHtml(m) {
  const role = m.role;
  const cls = role === "assistant" ? "assistant" : role === "system" ? "system" : role === "judge" ? "judge" : role === "user" ? "user" : "inter";
  const meta = m.meta || {};
  const lps = meta.logprob_stats;
  const stats = (meta.tokens_per_sec ? `${meta.completion_tokens}${meta.tokens_estimated ? "~" : ""} tok · ${meta.tokens_per_sec} tok/s · ${meta.latency}s${meta.finish_reason === "length" ? " · TRUNCATED" : ""}` : "")
    + (lps ? ` · perplexity ${lps.perplexity} · ${lps.forks} fork${lps.forks === 1 ? "" : "s"}` : "");
  return `<div class="msg ${cls} ${meta.injected ? "injected" : ""} ${m.streaming ? "streaming" : ""}">
    <div class="who"><span>${esc(role)}${meta.run_system_prompt ? " · includes the run's system prompt" : ""}${meta.injected ? " · injected by tester" : ""}${meta.purpose ? " · " + esc(meta.purpose) : ""}${m.streaming ? " · streaming…" : ""}</span><span style="font-weight:400">${esc(stats)}</span></div>
    ${m.reasoning ? `<details class="reason" data-k="${m.streaming ? "stream" : m.id}"><summary>reasoning (${m.reasoning.length} chars)</summary><div>${esc(m.reasoning)}</div></details>` : ""}<div class="txt">${S.lpView && m.logprobs ? tokHtml(m.logprobs) : esc(m.content)}</div></div>`;
}

// Metric values: probability tables and token alternatives read better as text than as JSON.
const isNumMap = (v) => v && typeof v === "object" && !Array.isArray(v) && Object.values(v).length && Object.values(v).every(x => typeof x === "number");
const fmtP = (x) => (Math.round(x * 1000) / 1000).toString();
function metricHtml(v) {
  if (v == null || typeof v !== "object") return esc(v);
  if (isNumMap(v)) return Object.entries(v).map(([k, x]) => `${esc(k)} <b>${fmtP(x)}</b>`).join(" · ");
  if (Array.isArray(v?.alternatives)) return `said ${esc(JSON.stringify(v.said))}<br>was choosing between: ` +
    v.alternatives.map(([t, p]) => `${esc(JSON.stringify(t))} <b>${fmtP(p)}</b>`).join(" · ");
  const rows = Object.entries(v);
  if (rows.length && rows.every(([, x]) => isNumMap(x)))
    return rows.map(([k, x]) => `${esc(k)}: ${metricHtml(x)}`).join("<br>");
  return esc(JSON.stringify(v));
}

// One span per answer token, colored by its probability; hover for the alternatives the model considered.
function tokHtml(lp) {
  const vis = lp.filter(t => !t[3]);
  while (vis.length && !vis[0][0].trim()) vis.shift();
  return vis.map(([tok, l, alts]) => {
    const p = Math.exp(l), b = p < .1 ? 0 : p < .3 ? 1 : p < .6 ? 2 : p < .9 ? 3 : 4;
    const others = (alts || []).filter(a => a[0].trim() !== tok.trim()).slice(0, 6).map(a => `  ${JSON.stringify(a[0])}  ${Math.exp(a[1]).toFixed(3)}`).join("\n");
    return `<span class="tok lp${b}" title="${esc(`${JSON.stringify(tok)}  p=${p.toFixed(3)}` + (others ? "\nalternatives:\n" + others : ""))}">${esc(tok)}</span>`;
  }).join("");
}

      ${j.summary ? `<div class="card section"><h3>Judge annotation</h3><div>${esc(j.summary)}</div>

      ${(r.flags || []).length || metrics.length || (r.notes || []).length || r.error ? `<div class="card section"><h3>Result details</h3>

        ${(r.notes || []).map(n => `<pre class="sub" style="white-space:pre-wrap;margin:6px 0 0">${esc(n)}</pre>`).join("")}</div>` : ""}
      <div class="card section"><h3 style="display:flex;gap:10px;align-items:center">Transcript
        ${messages.some(m => m.logprobs) ? `<button class="btn" style="text-transform:none;letter-spacing:0" onclick="S.lpView=!S.lpView;renderDrawer()">${S.lpView ? "Hide" : "Show"} token confidence</button>` : ""}</h3>
        ${S.lpView && messages.some(m => m.logprobs) ? `<div class="lplegend" style="margin-bottom:8px">token probability: <span class="tok lp0">&lt;0.1</span><span class="tok lp1">&lt;0.3</span><span class="tok lp2">&lt;0.6</span><span class="tok lp3">&lt;0.9</span><span class="tok">≥0.9</span> · hover a token for the alternatives</div>` : ""}
        <div class="tabs">${nonJudge.length > 1 ? `<button class="${!d.thread ? "active" : ""}" onclick="setThread(null)">all conversations</button>` : ""}
          ${threads.map(t => `<button class="${d.thread === t || (!d.thread && nonJudge.length <= 1 && t === nonJudge[0]) ? "active" : ""}" onclick="setThread('${esc(t)}')">${esc(t === "judge" ? "judge calls" : "thread " + t)}</button>`).join("")}</div>

async function showPrompt(model, baseUrl, snapshot) {
  S.drawer = null;

  let p = snapshot;
  if (!p) {
    panel(top({model}) + `<div class="body"><div class="card empty">Asking the server…</div></div>`);

    catch (e) { p = {model, available: false, note: e.message}; }

    <div class="card section"><h3>Built-in system prompt</h3>${p.server === "llamacpp" && p.system ? `<div class="sub" style="margin-bottom:6px">Everything the chat template puts before your first message.</div>` : ""}${sys}</div>

}

  return `${d.warnings.map(w => `<div class="card pad st-running" style="margin-bottom:8px">${esc(w)}</div>`).join("")}
    <div class="card"><div class="pad sub">${d.runs.length} runs of ${esc(d.models.join(", "))}: ${d.runs.map(r => `<a href="#" onclick="openRun('${esc(r.id)}');return false">${esc(r.id)}</a>`).join(", ")}
      ${d.judge_model ? ` · beliefs compared by ${esc(d.judge_model)} ${fmtTime(d.judged_at)}` : ""}</div>
    <table><thead><tr><th>case (least stable first)</th><th>stability</th><th>statuses</th><th>score</th><th>interest</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="sub">No finished cases.</td></tr>`}</tbody></table></div>`;
}

    return `<tr class="${embed ? "dim" : ""}">
      <td><input type="checkbox" class="msel" value="${esc(m.id)}" ${S.modelSel.has(m.id) ? "checked" : ""} ${embed ? "disabled title='embedding model: not testable'" : ""}></td>
      <td><b>${esc(m.id)}</b> ${embed ? "" : `<a href="#" class="sub" onclick="showPrompt('${esc(m.id)}', S.models.base_url);return false">prompt</a>`} ${m.loaded ? `<span class="chip st-pass">loaded</span>` : ""} ${m.kind !== "llm" ? `<span class="chip st-skipped">${esc(m.kind)}</span>` : ""} ${m.stale ? `<span class="chip st-skipped">cached</span>` : ""}</td>
      <td class="sub">${esc(details || "–")} ${caps.map(c => `<span class="flag">${esc(c)}</span>`).join("")}</td>
      ${full ? `<td class="sub">${esc(m.server)}</td>` : ""}
      <td>${L ? `<a href="#" onclick="openRun('${esc(L.id)}');return false">${L.avg_score != null ? "avg " + L.avg_score.toFixed(2) : "view"}</a> <span class="sub">${fmtTime(L.started_at)} · ${m.runs} run${m.runs === 1 ? "" : "s"}</span>`
        : m.runs ? `<span class="sub">${m.runs} run(s)</span>` : `<span class="sub st-running">never tested</span>`}</td></tr>`;
  }).join("")}</tbody></table>`;
}
async function openRun(id) { S.view = "runs"; save(); await selectRun(id); setView("runs"); }

// Fetch the endpoint's models into #el; default selection = configured model, else first loaded/chat model.
async function loadModelList(url, el, full) {
  el.innerHTML = `<div class="empty">Pulling models from ${esc(url)}…</div>`;
  let d;
  try { d = await fetchModels(url); } catch (e) { d = {models: [], error: e.message}; }
  S.models = d;
  const ids = new Set(d.models.filter(m => m.kind !== "embedding").map(m => m.id));
  S.modelSel = new Set([...S.modelSel].filter(x => ids.has(x)));
  if (!S.modelSel.size) { const first = ids.has(d.configured) ? d.configured : [...ids][0]; if (first) S.modelSel.add(first); }
  el.innerHTML = modelTable(d, full);
  el.onchange = (e) => { if (e.target.classList.contains("msel")) { e.target.checked ? S.modelSel.add(e.target.value) : S.modelSel.delete(e.target.value); updateSelCount(); } };
  updateSelCount();
  return d;
}
function updateSelCount() { document.querySelectorAll(".selcount").forEach(x => x.textContent = `${S.modelSel.size} selected`); }
function selectAllModels(on) { document.querySelectorAll(".msel:not(:disabled)").forEach(c => { c.checked = on; on ? S.modelSel.add(c.value) : S.modelSel.delete(c.value); }); updateSelCount(); }

async function renderModels(m) {
  const cfg = await getCfg();
  S.endpoint ||= cfg.target.base_url;
  m.innerHTML = `<div class="card form" style="max-width:none;margin-bottom:12px">
      <div><b style="font-size:16px">Models</b><div class="sub">Pulled live from the endpoint, with whatever metadata the server exposes (Ollama and LM Studio give size, quantization, context and load state). Pick some and test them.</div></div>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <div style="flex:1;min-width:240px"><label>Endpoint (OpenAI-compatible base URL)</label><input type="text" id="mb" value="${esc(S.endpoint)}"></div>
        ${keyInput(cfg, "mk")}
        <button class="btn" id="mref">Refresh</button>
        <button class="btn primary" id="mtest">Test selected →</button> <span class="sub selcount"></span></div></div>
    <div class="card" id="mlist"></div>`;
  const reload = () => { S.endpoint = $("#mb").value.trim(); loadModelList(S.endpoint, $("#mlist"), true); };
  $("#mref").onclick = reload;
  $("#mb").oninput = debounce(reload, 700);
  bindKeyInput("mk", reload);
  $("#mtest").onclick = () => setView("new");
  await loadModelList(S.endpoint, $("#mlist"), true);
}

async function renderNew(m) {
  m.innerHTML = `<div class="card empty">Loading…</div>`;
  const [cfg, suites] = await Promise.all([getCfg(), S.suites ? S.suites : api("/api/suites")]);
  S.suites = suites;
  S.endpoint ||= cfg.target.base_url;
  const pick = (kind) => suites.filter(s => s.kind === kind).map(s => `<label><input type="checkbox" name="suite" value="${esc(s.name)}" checked>
    <span><b>${esc(s.name)}</b> <span class="sub">${s.cases.length} cases</span><small>${esc(s.description)}</small></span></label>`).join("");
  m.innerHTML = `<div class="card form">
    <div><b style="font-size:16px">Start a run</b><div class="sub">Runs in this server process; you can also start runs from the CLI with <code>tealeaf run</code>, and they appear here live. Selecting several models queues one run per model.</div></div>
    <div><label>Target endpoint (OpenAI-compatible base URL). Models are pulled from it automatically.</label>
      <div style="display:flex;gap:8px"><input type="text" id="nb" value="${esc(S.endpoint)}"><button class="btn" id="nref">Refresh</button></div></div>
    ${keyInput(cfg, "nk")}
    <div><label>Models to test · <span class="selcount"></span> · <a href="#" onclick="selectAllModels(true);return false">all</a> · <a href="#" onclick="selectAllModels(false);return false">none</a></label>
      <div class="card" id="npick" style="max-height:320px;overflow:auto"></div></div>
    <div class="grid2">
      <div><label>Judge base URL (blank = each model judges itself)</label><input type="text" id="jb" value="${esc(cfg.judge?.base_url || "")}"></div>
      <div><label>Judge model</label><input type="text" id="jm" value="${esc(cfg.judge?.model || "")}"></div>
      <div><label>Label</label><input type="text" id="nl" placeholder="optional"></div>
      <div class="grid2"><div><label>Samples (randomness)</label><input type="number" id="ns" value="${cfg.run.samples}" min="2"></div>
        <div><label>Conversation turns</label><input type="number" id="nt" value="${cfg.run.conversation_turns}" min="1"></div></div>
      <div><label>Repeats per model (≥2 groups the runs for the Stability view)</label><input type="number" id="nr" value="1" min="1" max="50"></div>
    </div>
    <div><label>System prompt for the target (optional). It goes at the start of every conversation, ahead of a case's own system prompt; the judge never sees it.</label>
      <textarea id="nsys" rows="3" style="font:13px/1.45 var(--mono);resize:vertical" placeholder="e.g. You are a helpful assistant deployed by Acme Corp.">${esc(cfg.run.system_prompt || "")}</textarea></div>
    <div><label>Traditional benchmarks <a href="#" onclick="toggleAll('traditional');return false">toggle</a></label><div class="suitepick" data-kind="traditional">${pick("traditional")}</div></div>
    <div><label>Exploratory probes <a href="#" onclick="toggleAll('probe');return false">toggle</a></label><div class="suitepick" data-kind="probe">${pick("probe")}</div></div>
    <div><button class="btn primary" id="go">Start run</button> <span id="nerr" class="st-fail"></span></div></div>`;
  const reload = () => { S.endpoint = $("#nb").value.trim(); loadModelList(S.endpoint, $("#npick"), false); };
  $("#nref").onclick = reload;
  $("#nb").oninput = debounce(reload, 700);
  bindKeyInput("nk", reload);
  loadModelList(S.endpoint, $("#npick"), false);
  $("#go").onclick = async () => {
    if (!S.modelSel.size) { $("#nerr").textContent = "Select at least one model."; return; }
    const body = {suites: [...document.querySelectorAll("input[name=suite]:checked")].map(x => x.value),
      base_url: $("#nb").value.trim(), models: [...S.modelSel], label: $("#nl").value,
      judge_base_url: $("#jb").value || null, judge_model: $("#jm").value || null,
      samples: +$("#ns").value || null, conversation_turns: +$("#nt").value || null,
      repeat: Math.max(1, +$("#nr").value || 1), system_prompt: $("#nsys").value, api_key: S.apiKey || null};
    $("#go").disabled = true; $("#nerr").textContent = "";
    try { const r = await api("/api/runs", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      S.runId = r.run_id; await loadRuns(); await loadRun(r.run_id); setView("runs"); }
    catch (e) { $("#nerr").textContent = e.message; $("#go").disabled = false; }
  };
}
function toggleAll(kind) { const bs = document.querySelectorAll(`.suitepick[data-kind=${kind}] input`); const on = ![...bs].every(b => b.checked); bs.forEach(b => b.checked = on); }

// ------------------------------------------------------------------ live events
const refreshRuns = debounce(async () => { await loadRuns(); const el = $("#runlist"); if (el) el.innerHTML = runListHtml(); }, 300);
const refreshRun = debounce(async () => { if (S.runId) { await loadRun(S.runId); if (S.view === "runs") renderRunDetail(); } }, 300);
const refreshDrawerD = debounce(refreshDrawer, 250);

function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("#livedot").classList.add("on"); $("#livetxt").textContent = "live"; };
  es.onerror = () => { $("#livedot").classList.remove("on"); $("#livetxt").textContent = "reconnecting"; };
  const handle = (e) => {
    const p = JSON.parse(e.data); const t = p.type;
    if (["run_started", "run_finished", "test_finished"].includes(t)) refreshRuns();
    if (p.run_id === S.runId && ["test_started", "test_finished", "run_finished", "run_started"].includes(t)) refreshRun();
    if (t === "partial") {
      S.partial[`${p.run_id}|${p.case_id}`] = p;
      if (p.run_id === S.runId) { const el = $("#nowtext"); if (el) { el.textContent = (p.content || (p.reasoning ? "(thinking) " + p.reasoning : "")).slice(-1200); el.scrollTop = el.scrollHeight; } }
      if (S.drawer && S.drawer.runId === p.run_id && S.drawer.caseId === p.case_id) renderDrawer();
    }
    if (t === "message" || t === "test_finished") {
      delete S.partial[`${p.run_id}|${p.case_id}`];
      if (S.drawer && S.drawer.runId === p.run_id && S.drawer.caseId === p.case_id) refreshDrawerD();
    }
  };
  ["run_started", "run_finished", "test_started", "test_finished", "message", "partial"].forEach(k => es.addEventListener(k, handle));
}

(async () => {
  await loadRuns();
  S.runId = saved.runId && S.runs.some(r => r.id === saved.runId) ? saved.runId : (S.runs[0]?.id || null);
  await loadRun(S.runId);
  setView(saved.view || "runs");
  connect();
})();
</script>
