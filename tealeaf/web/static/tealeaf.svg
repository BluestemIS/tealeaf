  <!-- leaf -->
  <path d="M86 164 C92 118 128 88 168 82 C164 124 132 158 86 164 Z" fill="url(#leaf)" stroke="#2e5a26" stroke-width="3" stroke-linejoin="round"/>
  <path d="M90 160 Q126 130 164 87" fill="none" stroke="#d9efc4" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 140 L106 122 M124 126 L122 108 M138 112 L138 96 M112 141 L130 142 M128 126 L146 125 M142 110 L156 108" fill="none" stroke="#d9efc4" stroke-width="2" stroke-linecap="round" opacity=".8"/>
