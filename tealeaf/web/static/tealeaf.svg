<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Tealeaf">
  <title>Tealeaf</title>
  <defs>
    <radialGradient id="tea" cx="44%" cy="40%" r="62%">
      <stop offset="0" stop-color="#e0a352"/>
      <stop offset=".65" stop-color="#b8742c"/>
      <stop offset="1" stop-color="#7e4a1c"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7a33"/>
      <stop offset="1" stop-color="#7fb85a"/>
    </linearGradient>
  </defs>
  <!-- saucer -->
  <circle cx="122" cy="134" r="114" fill="#ece6d8" stroke="#cfc6b2" stroke-width="3"/>
  <circle cx="122" cy="134" r="96" fill="none" stroke="#ddd5c3" stroke-width="2"/>
  <!-- handle -->
  <rect x="190" y="112" width="58" height="34" rx="17" fill="#fbfaf6" stroke="#2e3a2b" stroke-width="7"/>
  <!-- cup -->
  <circle cx="122" cy="128" r="86" fill="#fbfaf6" stroke="#2e3a2b" stroke-width="7"/>
  <circle cx="122" cy="128" r="70" fill="url(#tea)"/>
  <ellipse cx="96" cy="98" rx="22" ry="9" fill="#fff" opacity=".22" transform="rotate(-30 96 98)"/>
